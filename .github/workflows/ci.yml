name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      - name: Run tests
        run: python -m pytest

  infrastructure-validation:
    name: Infrastructure validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform

      - name: Validate Terraform stacks without AWS credentials
        run: |
          for stack in \
            infra/terraform/bootstrap \
            infra/terraform/environments/poc \
            infra/terraform/environments/poc-platform
          do
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate -no-color
          done

      - name: Render Kubernetes manifests
        run: kubectl kustomize k8s/overlays/poc > /tmp/emotion-api.yaml

      - name: Validate IAM policy JSON
        run: |
          for policy in infra/iam/*.json
          do
            jq empty "$policy"
          done

      - name: Reject sensitive generated files
        run: |
          if git ls-files | grep -E '(\.tfstate|\.tfplan|\.tfvars(\.json)?$|\.keras$|\.h5$|\.zip$|(^|/)\.env($|\.))'
          then
            echo "Generated artifact or local secret file is tracked."
            exit 1
          fi
